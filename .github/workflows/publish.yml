name: publish

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Toolchain versions
        run: node --version && npm --version && bun --version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Check package
        run: bun run check:package

      - name: Check size
        run: bun run check:size

      - name: Publish if version is new
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "bannergress-api@$VERSION" version >/dev/null 2>&1; then
            echo "bannergress-api@$VERSION is already published, skipping"
            exit 0
          fi
          npm publish --access public --provenance --loglevel=verbose
